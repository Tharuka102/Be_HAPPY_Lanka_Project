<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Welcome Back</h1>
      <p>Please sign in to continue</p>
    </div>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label>Email</label>
        <input 
          type="email" 
          formControlName="email" 
          placeholder="Enter your email"
          [ngClass]="{ 'is-invalid': submitted && f['email'].errors }"
        >
        <div *ngIf="submitted && f['email'].errors" class="error-message">
          <div *ngIf="f['email'].errors['required']">Email is required</div>
          <div *ngIf="f['email'].errors['email']">Please enter a valid email</div>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-input">
          <input 
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password" 
            placeholder="Enter your password"
            [ngClass]="{ 'is-invalid': submitted && f['password'].errors }"
          >
          <span 
            class="password-toggle"
            (click)="togglePasswordVisibility($event)"
          >
            <i class="eye-icon">{{ showPassword ? '👁️' : '👁️‍🗨️' }}</i>
          </span>
        </div>
        <div *ngIf="submitted && f['password'].errors" class="error-message">
          <div *ngIf="f['password'].errors['required']">Password is required</div>
          <div *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</div>
          <div *ngIf="f['password'].errors['pattern']">Password must contain both letters and numbers</div>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" formControlName="rememberMe">
          <span>Remember me</span>
        </label>
        <a href="/m-reset-email" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn" [disabled]="loading">
        <span>{{ loading ? 'Signing in...' : 'Sign In' }}</span>
      </button>

      <button type="button" class="google-btn" (click)="loginWithGoogle()">
        <img src="https://www.google.com/favicon.ico" alt="Google" width="18" height="18">
        <span>Continue with Google</span>
      </button>

      <p class="signup-text">
        Don't have an account? <a href="/m-register-choice" class="signup-link">Sign up</a>
      </p>
    </form>
  </div>
</div>
