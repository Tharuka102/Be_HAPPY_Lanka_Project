<div class="register-container">
  <div class="register-box">
    <div class="header">
      <h2>Welcome to Our Platform</h2>
      <p class="subtitle">Choose your registration type to get started</p>
    </div>
    

    <div class="button-group">
      <button (click)="navigateToRegister('d-sidebar')" class="register-btn counselor" >
        <div class="icon-wrapper counselor-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 10h2v2H6zm0 4h8v2H6zm10 0h2v2h-2zm-6-4h8v2h-8z"/>
          </svg>
        </div>
        <div class="btn-content">
          <span class="btn-title">Counselor</span>
          <span class="btn-subtitle">Register as a Mental Health Professional</span>
        </div>
      </button>



      <button (click)="navigateToRegister('p-sidebar')" class="register-btn patient">
        <div class="icon-wrapper patient-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0-6c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 7c-2.67 0-8 1.34-8 4v3h16v-3c0-2.66-5.33-4-8-4zm6 5H6v-.99c.2-.72 3.3-2.01 6-2.01s5.8 1.29 6 2v1z"/>
          </svg>
        </div>
        <div class="btn-content">
          <span class="btn-title">Patient</span>
          <span class="btn-subtitle">Register to Get Support and Guidance</span>
        </div>
      </button>
    </div>



    <div class="footer">
      <p>Already have an account? <a href="/m-login" class="login-link">Login here</a></p>
    </div>
  </div>
</div>
