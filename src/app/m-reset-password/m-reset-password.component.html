<div class="reset-password-container">
  <div class="reset-password-card">
    <h2>Set New Password</h2>
    <p class="step-indicator">Step 3 of 3</p>

    <form [formGroup]="resetForm" (ngSubmit)="resetPassword()">
      <!-- New Password -->
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input
          type="password"
          id="newPassword"
          formControlName="newPassword"
          [class.error]="newPassword?.invalid && newPassword?.touched"
          placeholder="Enter new password"
        >
        <div class="error-message" *ngIf="newPassword?.invalid && newPassword?.touched" aria-live="polite">
          <span *ngIf="newPassword?.errors?.['required']">Password is required</span>
          <span *ngIf="newPassword?.errors?.['minlength']">Password must be at least 8 characters</span>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          formControlName="confirmPassword"
          [class.error]="confirmPassword?.invalid && confirmPassword?.touched"
          placeholder="Confirm new password"
        >
        <div class="error-message" *ngIf="confirmPassword?.invalid && confirmPassword?.touched" aria-live="polite">
          <span *ngIf="confirmPassword?.errors?.['required']">Confirm password is required</span>
          <span *ngIf="confirmPassword?.errors?.['passwordMismatch']">Passwords do not match</span>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" [disabled]="resetForm.invalid || isLoading">
        {{ isLoading ? 'Resetting...' : 'Reset Password' }}
      </button>

      <!-- Back Link -->
      <a routerLink="/m-verify-code" class="back-link">Back to Verification</a>

      <!-- Success/Error Message -->
      <p *ngIf="message" class="message">{{ message }}</p>
    </form>
  </div>
</div>
